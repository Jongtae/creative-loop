name: Bug report
description: Reproducible failure in the local creative workflow
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 단계
      description: 비밀 키·실제 고객 댓글·비공개 이미지를 포함하지 마세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 결과와 실제 결과
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / Python / 브라우저
